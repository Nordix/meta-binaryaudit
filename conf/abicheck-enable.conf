# Enable ABI checking without modifying local.conf.
#
# Usage:
#   bitbake -R <path-to-this-file>/abicheck-enable.conf <target>
#
# Or set a reference baseline for comparison:
#   BINARY_AUDIT_REFERENCE_BASEDIR=/path/to/buildhistory.baseline \
#   bitbake -R <path-to-this-file>/abicheck-enable.conf <target>
#
# To promote ABI changes from warnings to build errors, also pass:
#   bitbake -R <path-to-this-file>/abicheck-enable.conf \
#           -R <path-to-this-file>/abicheck-errors.conf <target>

INHERIT += "abicheck"
TOOLCHAIN_HOST_TASK:append = " nativesdk-libabigail"

# Uncomment locally to allow fetching during ABI check runs; do not push enabled.
# BB_ALLOWED_NETWORKS = ""
